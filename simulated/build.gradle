plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/fabric-module.gradle')

loom {
    runs {
        datagen {
            inherit server
            name = 'Simulated Fabric Data Generation'
            runDir = 'runs/datagen'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg '-Dfabric-api.datagen.modid=simulated'
        }
    }
}

// PORT-NOTE(mc26.1): Porting Lib has no 26.1 release, so its datagen API is stubbed for compilation.
// See PORTING-26.1.md (Datagen stubs). This replaces the old unpackPortingLibCompat bundling.
sourceSets.main.java.srcDir('src/datagenStubs/java')

dependencies {
    implementation(project(':sable')) {
        transitive = false
    }
    runtimeOnly("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}") {
        transitive = false
    }
    include(implementation("teamreborn:energy:${energy_version}"))
}

tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
